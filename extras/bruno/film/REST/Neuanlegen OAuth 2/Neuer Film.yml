info:
  name: Neuen Film anlegen
  type: http
  seq: 1

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "titel": "Der neue Film",
        "art": "4K",
        "erscheinungsdatum": "2025-02-28",
        "genre": "Action",
        "rating": 7.5,
        "verfuegbar": true,
        "preis": 19.99,
        "schlagwoerter": ["SPANNEND"],
        "regisseur": {
          "name": "Max Mustermann",
          "geburtsjahr": 1980
        },
        "cover": [{
          "info": "Cover 1",
          "contentType": "img/png"
        }]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.headers.location
      operator: matches
      value: /rest\/[1-9]\d*$
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
