info:
  name: Neuer Film mit ungültigen Daten
  type: http
  seq: 3

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "titel": "",
        "art": "4K",
        "erscheinungsdatum": "2028-302-30",
        "genre": "Action",
        "rating": 15,
        "verfuegbar": true,
        "preis": -1,
        "regisseur": {
          "name": "?!",
          "geburtsjahr": 2100
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Fehlermeldungen im Response Body', () => {
          const props = ['titel', 'art', 'erscheinungsdatum', 'genre', 'rating', 'verfuegbar', 'preis', 'regisseur'];
          const { detail } = res.getBody();
          expect(detail).to.be.an('array').that.has.a.lengthOf(props.length);
          const paths = detail.map(det => det.path);
          paths.forEach(path => {
            expect(path).to.be.an('array').that.is.not.empty;
            expect(path[0]).to.be.a('string').that.includes.oneOf(props);
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json
    - expression: res.body
      operator: isJson
    - expression: res.body
      operator: isNotEmpty
    - expression: res.body.statusCode
      operator: eq
      value: "422"
    - expression: res.body.title
      operator: eq
      value: Unprocessable Content

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
