info:
  name: Film 3 mit falscher Versionsnummer ändern
  type: http
  seq: 2

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: "0"
  params:
    - name: id
      value: "3"
      type: path
  body:
    type: json
    data: |-
      {
        "titel": "Interstellar",
        "art": BlueRay,
        "erscheinungsdatum": "2014-11-07",
        "genre": ScienceFiction,
        "rating": 8.6,
        "verfuegbar": true,
        "preis": 15.99,
        "schlagwoerter": ["AUFREGEND", "TRAURIG", "SPANNEND"]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "412"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json
    - expression: res.body.statusCode
      operator: eq
      value: "412"
    - expression: res.body.detail
      operator: contains
      value: Versionsnummer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
