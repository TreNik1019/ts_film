info:
  name: Film 3 ändern
  type: http
  seq: 1

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: '"0"'
  params:
    - name: id
      value: "3"
      type: path
  body:
    type: json
    data: |
      {
        "titel": "Interstellar",
        "art": BlueRay,
        "erscheinungsdatum": "2014-11-07",
        "genre": ScienceFiction,
        "rating": 8.6,
        "verfuegbar": true,
        "preis": 15.99,
        "schlagwoerter": ["AUFREGEND", "TRAURIG", "SPANNEND"]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
