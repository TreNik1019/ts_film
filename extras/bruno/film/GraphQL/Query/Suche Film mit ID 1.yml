info:
  name: Suche Film mit ID 1
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      query ($id: ID! = "1") {
        film(id: $id) {
          version
          titel
          art
          erscheinungsdatum
          genre
          rating
          verfuegbar
          preis
          schlagwoerter
        }
      }
    variables: |-
      {
        "id": "1"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.data.film.version
      operator: isString
    - expression: res.body.data.film.titel
      operator: gte
      value: "0"
    - expression: res.body.data.film.art
      operator: gte
      value: "0"
    - expression: res.body.data.film.erscheinungsdatum
      operator: isString
    - expression: res.body.data.film.genre
      operator: gte
      value: "0"
    - expression: res.body.data.film.rating
      operator: isBoolean
    - expression: res.body.data.film.verfuegbar
      operator: isString
    - expression: res.body.data.film.preis
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
