info:
  name: Film mit ID 4 aktualisieren
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      mutation {
        update(
          input: {
            id: 4,
            version: 1,
            titel: "Parasite",
            art: 4K,
            erscheinungsdatum: "2019-05-30",
            genre: Thriller,
            rating: 8.5,
            verfuegbar: FALSE,
            preis: 18.99,
            schlagwoerter: [""SPANNEND"",""TRAURIG"",""GRUSELIG""]
          }
        ) {
            version
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.data.update.version
      operator: isNumber
    - expression: res.body.data.update.version
      operator: gte
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
