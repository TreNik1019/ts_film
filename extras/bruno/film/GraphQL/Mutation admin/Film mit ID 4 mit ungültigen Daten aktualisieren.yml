info:
  name: Film mit ID 4 mit ungültigen Daten aktualisieren
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      mutation {
        update(
          input: {
            id: 4,
            version: 0,
            titel: "Parasite",
            art: Kasettenfilm,
            erscheinungsdatum: "2019-05-30",
            genre: Dokumentation,
            rating: -1,
            verfuegbar: FALSE,
            preis: -1,
            schlagwoerter: [""SPANNEND"",""TRAURIG"",""GRUSELIG""]
          }
        ) {
            version
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.errors
      operator: isArray
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].message
      operator: contains
      value: rating
    - expression: res.body.errors[0].message
      operator: contains
      value: preis
    - expression: res.body.errors[0].message
      operator: contains
      value: art
    - expression: res.body.errors[0].path
      operator: isArray
    - expression: res.body.errors[0].path
      operator: length
      value: "1"
    - expression: res.body.errors[0].path[0]
      operator: eq
      value: update
    - expression: res.body.errors[0].extensions.code
      operator: eq
      value: BAD_USER_INPUT

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
