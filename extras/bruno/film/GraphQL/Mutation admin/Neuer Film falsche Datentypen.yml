info:
  name: Neuer Film falsche Datentypen
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      mutation {
        create(
          input: {
            titel: "Der Herr der Ringe",
            art: "4K",
            erscheinungsdatum: "false",
            genre: "Action",
            rating: "9.9",
            verfuegbar: "TRUE",
            preis: "99.99",
            schlagwoerter: [0, true],
            regisseur: {
              name: Max Mustermann,
              geburtsjahr: "3000"
            },
            cover: {
              info: ok,
              contentType: image/png
            }
          }
        ) {
            id
        }
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body mit errors', () => {
          res.getBody()
            .errors
            .map(error => error.extensions.code)
            .forEach(code => expect(code).to.be.a('string').that.is.eql('GRAPHQL_VALIDATION_FAILED'));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.errors
      operator: isArray
    - expression: res.body.errors.length
      operator: gte
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
