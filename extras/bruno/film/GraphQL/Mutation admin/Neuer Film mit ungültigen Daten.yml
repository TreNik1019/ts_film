info:
  name: Neuer Film mit ungültigen Daten
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      mutation {
        create(
          input: {
            titel: "Der Herr der Ringe",
            art: 4K,
            erscheinungsdatum: "1954-07-29",
            genre: Action,
            rating: 11,
            verfuegbar: TRUE,
            preis: -99.99,
            schlagwoerter: ["UNSICHTBAR"],
            regisseur: {
              name: "",
              geburtsjahr: 3000
            },
            cover: {
              info: "ok",
              contentType: "image/png"
            }
          }
        ) {
            id
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.errors
      operator: isArray
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].message
      operator: contains
      value: titel
    - expression: res.body.errors[0].message
      operator: contains
      value: rating
    - expression: res.body.errors[0].message
      operator: contains
      value: erscheinungsdatum
    - expression: res.body.errors[0].message
      operator: contains
      value: preis
    - expression: res.body.errors[0].path
      operator: isArray
    - expression: res.body.errors[0].path
      operator: length
      value: "1"
    - expression: res.body.errors[0].path[0]
      operator: eq
      value: create
    - expression: res.body.errors[0].extensions.code
      operator: eq
      value: BAD_USER_INPUT
    - expression: res.body.data
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
