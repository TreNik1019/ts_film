info:
  name: Neues Buch
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      mutation {
        create(
          input: {
            titel: "Der Herr der Ringe",rating: 1,
            art: 4K,
            erscheinungsdatum: "1954-07-29",
            genre: Action,
            verfuegbar: TRUE,
            preis: 99.99,
            schlagwoerter: ["SPANNEND"],
            regisseur: {
              name: "Max Mustermann",
              geburtsjahr: "1980"
            },
            cover: [{
              info: "Cover 1",
              contentType: "img/png"
            }]
          }
        ) {
            id
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body mit id', () => {
          const { data } = res.getBody();
          const id = parseInt(data.create.id, 10);
          expect(id).to.be.gte(0);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.data.create
      operator: isJson
    - expression: res.body.data.create.id
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
